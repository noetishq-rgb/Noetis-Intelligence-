<style>
:root{--bg:#050505;--s1:#101010;--s2:#171717;--s3:#1f1f1d;--ink:#FCF8EF;--muted:#A69D8B;--line:#232320;--line2:#3a3934;--butter:#F6E7C1;--sand:#E7D6A8;--olive:#9A9E76;--iris:#9673E3;--warn:#E0A068;--bad:#E59A92;--sunk:#171717;--surface:#101010;--btn:#F6E7C1;--btnfg:#090909}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

@media (max-width:1100px){body{flex-direction:column}#shell{position:static;height:auto;flex:none;border-right:0;border-bottom:1px solid var(--line)}#ctx{position:static}#shell .subs,#shell .ctrl{display:none}#shell.open{flex-direction:column;align-items:stretch}#shell.open .subs,#shell.open .ctrl{display:flex}#shell.open .cap{display:block}#shell{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px}#shell>.col{flex-direction:row;align-items:center;gap:10px;margin-top:0}#shell nav{flex-direction:row;flex-wrap:wrap;gap:4px}#shell .nv{width:auto;min-height:38px}#shell .cap{display:none}#shell label{flex-direction:row;align-items:center}#shell>.col>.row{border-top:0;padding:0}}
</style>
</head>
<body>
<aside id="shell" aria-label="Navigation and controls"></aside>
<div id="wrap"><div id="ctx"></div><main id="app"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></main></div>
<div id="drawer"></div><div id="modal"></div><div id="palette"></div>
<div id="toast" role="status" hidden></div>
<script>
/* =====================================================================
   NOETIS — competitive, brand and growth intelligence (single-file build)
   1. CONFIG   2. Stores   3. Discovery engines   4. App   5. Globe
   ===================================================================== */

/* ---------- 1. CONFIG ------------------------------------------------ */
const CONFIG = {
  SUPABASE_URL: "",          // e.g. "https://abcd1234.supabase.co"
  SUPABASE_ANON_KEY: "",     // publishable key only — never the service key
  RESEARCH_ENDPOINT: "",     // server function that streams discovery events (newline-delimited JSON)
  META_OAUTH_START_URL: "",  // server route that begins Meta OAuth; tokens never reach this page
  WORLD_SCRIPT: "https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.min.js" // country outlines for the globe
};
const TABLES = ["brands", "brand_profile_items", "products_services", "audience_profiles", "competitors", "market_signals", "opportunities", "opportunity_evidence", "strategies", "activity_events"];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
const now = () => new Date().toISOString();
const daysAgo = n => new Date(Date.now() - n * 864e5).toISOString();

/* ---------- 2. Stores ------------------------------------------------
   Same four async methods on both, so the app never knows which it has:
   list(table, where)  insert(table, row)  update(table, id, patch)  remove(table, id)   */
class LocalStore {
  constructor() {
    this.name = "local"; this.key = "noetis-workspace-v2"; this.persistent = true;
    try { this.db = JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { this.db = {}; this.persistent = false; }
    TABLES.forEach(t => { if (!Array.isArray(this.db[t])) this.db[t] = []; });
  }
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.db)); } catch (e) { this.persistent = false; } }
  async init() { return { ready: true }; }
  async list(table, where = {}) { return this.db[table].filter(r => Object.keys(where).every(k => r[k] === where[k])).map(r => ({ ...r })); }
  async insert(table, row) { const r = { id: uid(), created_at: now(), ...row }; this.db[table].push(r); this.save(); return { ...r }; }
  async update(table, id, patch) { const r = this.db[table].find(x => x.id === id); if (!r) throw new Error("Row not found"); Object.assign(r, patch, { updated_at: now() }); this.save(); return { ...r }; }
  async remove(table, id) {
    this.db[table] = this.db[table].filter(x => x.id !== id);
    if (table === "brands") TABLES.filter(t => t !== "brands").forEach(t => { this.db[t] = this.db[t].filter(x => x.brand_id !== id); });
    if (table === "opportunities") { this.db.opportunity_evidence = this.db.opportunity_evidence.filter(x => x.opportunity_id !== id); this.db.strategies = this.db.strategies.filter(x => x.opportunity_id !== id); }
    if (table === "market_signals") this.db.opportunity_evidence = this.db.opportunity_evidence.filter(x => x.signal_id !== id);
    this.save();
  }
  dump() { return JSON.parse(JSON.stringify(this.db)); }
  wipe() { TABLES.forEach(t => { this.db[t] = []; }); this.save(); }
}

class SupabaseStore {
  constructor(url, key) { this.name = "supabase"; this.url = url; this.key = key; this.persistent = true; this.workspaceId = null; this.user = null; }
  async init() {
    if (!window.supabase) await new Promise((ok, fail) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"; s.onload = ok; s.onerror = () => fail(new Error("Could not load supabase-js")); document.head.appendChild(s); });
    this.client = window.supabase.createClient(this.url, this.key);
    const { data } = await this.client.auth.getSession();
    this.user = data.session ? data.session.user : null;
    if (!this.user) return { ready: false };
    await this.ensureWorkspace(); return { ready: true };
  }
  async signIn(email, password) { const { data, error } = await this.client.auth.signInWithPassword({ email, password }); if (error) throw error; this.user = data.user; await this.ensureWorkspace(); }
  async signUp(email, password) { const { data, error } = await this.client.auth.signUp({ email, password }); if (error) throw error; if (!data.session) throw new Error("Check your email to confirm the account, then sign in."); this.user = data.user; await this.ensureWorkspace(); }
  async signOut() { await this.client.auth.signOut(); this.user = null; this.workspaceId = null; }
  async ensureWorkspace() {
    const { data, error } = await this.client.from("workspace_members").select("workspace_id").limit(1); if (error) throw error;
    if (data.length) { this.workspaceId = data[0].workspace_id; return; }
    const made = await this.client.rpc("create_workspace", { workspace_name: "NOETIS" }); if (made.error) throw made.error; this.workspaceId = made.data;
  }
  async list(table, where = {}) { let q = this.client.from(table).select("*").order("created_at"); Object.entries(where).forEach(([k, v]) => { q = q.eq(k, v); }); const { data, error } = await q; if (error) throw error; return data; }
  async insert(table, row) { const { data, error } = await this.client.from(table).insert({ ...row, workspace_id: this.workspaceId }).select().single(); if (error) throw error; return data; }
  async update(table, id, patch) { const { data, error } = await this.client.from(table).update({ ...patch, updated_at: now() }).eq("id", id).select().single(); if (error) throw error; return data; }
  async remove(table, id) { const { error } = await this.client.from(table).delete().eq("id", id); if (error) throw error; }   // children go via ON DELETE CASCADE
}


/* ---------- 3. Discovery engines -------------------------------------
   An engine is an async generator yielding events:
     { stage: 0-4, kind: "ok" | "skip" | "warn", msg, write?: { table, row, links?: [signal keys] } }
   The runner saves each write as it arrives and never overwrites a user-confirmed record. */
const STAGES = ["Reading the website", "Building the brand profile", "Mapping competitors", "Listening for signals", "Framing opportunities"];
const wait = ms => new Promise(r => setTimeout(r, ms));
const list = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);

// No engine connected: file what the client told us, and say plainly what was skipped.
async function* ManualEngine(brand) {
  const o = brand.onboarding || {}, mine = { provenance: "user_confirmed", confidence: "High", status: "confirmed", source_url: "" };
  const file = async function* (section, label, text, stage) { if (String(text || "").trim()) { yield { stage: stage, kind: "ok", msg: `filed from onboarding: ${label}`, write: { table: "brand_profile_items", row: { section, label, text, ...mine } } }; await wait(170); } };
  yield { stage: 0, kind: "ok", msg: "Brand record and onboarding answers saved" }; await wait(380);
  yield { stage: 0, kind: "skip", msg: `${brand.website} not read — discovery engine not connected` }; await wait(380);
  for (const [sec, label, text] of [["business", "What the business is", o.description], ["business", "Business model", o.business], ["business", "Business stage", o.stage], ["needs", "What customers need", o.needs], ["needs", "Why they buy", o.motivations], ["needs", "What stops them", o.barriers], ["positioning", "Brand promise", o.promise], ["positioning", "Value proposition", o.value_prop], ["positioning", "Why choose it", o.positioning], ["positioning", "Price position", o.price_pos], ["business", "Marketing running now", o.activities], ["business", "Marketing priorities", o.priorities], ["business", "Performance data available", o.perf_data], ["business", "Channels in use", (o.channels || []).join(", ")]]) yield* file(sec, label, text, 1);
  for (const name of list(o.products)) { yield { stage: 1, kind: "ok", msg: `product filed: ${name}`, write: { table: "products_services", row: { name, description: "", provenance: "user_confirmed", source_url: "" } } }; await wait(150); }
  for (const name of list(o.services)) { yield { stage: 1, kind: "ok", msg: `service filed: ${name}`, write: { table: "products_services", row: { name, description: "Service.", provenance: "user_confirmed", source_url: "" } } }; await wait(150); }
  if (o.intended) { yield { stage: 1, kind: "ok", msg: "intended audience filed", write: { table: "audience_profiles", row: { kind: "intended", description: o.intended, basis: "", provenance: "user_confirmed" } } }; await wait(240); }
  if (o.observed) { yield { stage: 1, kind: "ok", msg: `observed audience filed (${o.basis || "basis not given"})`, write: { table: "audience_profiles", row: { kind: "observed", description: o.observed, basis: o.basis || "", provenance: "user_confirmed" } } }; await wait(240); }
  else { yield { stage: 1, kind: "warn", msg: "gap: who actually buys — not answered, so it stays unknown" }; await wait(240); }
  for (const name of list(o.competitors)) { yield { stage: 2, kind: "ok", msg: `competitor from onboarding: ${name}`, write: { table: "competitors", row: { name, kind: "Direct", note: "Named during onboarding.", hq: "", markets: "", status: "confirmed", source_url: "" } } }; await wait(200); }
  yield { stage: 2, kind: "skip", msg: "Finding further competitors needs the discovery engine." }; await wait(340);
  yield { stage: 3, kind: "skip", msg: "No signals collected. Sources are not connected; add what you observe by hand." }; await wait(340);
  yield { stage: 4, kind: "skip", msg: "No opportunities framed. They are built from evidence, and there is none yet." };
}

// Real engine: POSTs the brand to your endpoint and reads newline-delimited JSON events back.
async function* RemoteEngine(brand) {
  const res = await fetch(CONFIG.RESEARCH_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ brand }) });
  if (!res.ok || !res.body) throw new Error(`Discovery endpoint answered ${res.status}`);
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) { const { value, done } = await reader.read(); if (done) break; buf += dec.decode(value, { stream: true }); const lines = buf.split("\n"); buf = lines.pop(); for (const line of lines) if (line.trim()) yield JSON.parse(line); }
  if (buf.trim()) yield JSON.parse(buf);
}
function engineFor(brand) {
  if (CONFIG.RESEARCH_ENDPOINT) return { name: "remote", run: () => RemoteEngine(brand) };

/* ----- discovery runner ----- */

  await store.update("brands", b.id, { status: "researching" }); b.status = "researching"; go("run");

}
