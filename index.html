<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOETIS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#050505;--s1:#101010;--s2:#171717;--s3:#1f1f1d;--ink:#FCF8EF;--muted:#A69D8B;--line:#232320;--line2:#3a3934;--butter:#F6E7C1;--sand:#E7D6A8;--olive:#9A9E76;--iris:#9673E3;--warn:#E0A068;--bad:#E59A92;--sunk:#171717;--surface:#101010;--btn:#F6E7C1;--btnfg:#090909}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--butter);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-family:"Instrument Serif",Georgia,serif;font-size:31px;line-height:1.12;font-weight:400;letter-spacing:-.005em}
h2{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.005em}
h3{font-size:14.5px;font-weight:600}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.mono,.cap{font-family:"JetBrains Mono",ui-monospace,monospace}
.mono{font-size:12px}
.cap{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
header{position:sticky;top:0;z-index:6;background:rgba(5,5,5,.96);border-bottom:1px solid var(--line)}
.bar1{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:10px 28px}
.bar2{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center;justify-content:space-between;padding:8px 28px;border-top:1px solid var(--line);background:var(--s1)}
.wm{font-size:16px;font-weight:700;letter-spacing:.18em}
.pnav button{min-height:44px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;font-weight:500;color:var(--muted)}
.pnav button:hover{color:var(--ink)}.pnav button.on{color:var(--butter);border-bottom-color:var(--butter)}
.snav{display:flex;flex-wrap:wrap;gap:6px}
main{padding:28px 28px 110px;max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.go{min-height:44px;padding:0 20px;border-radius:8px;border:0;background:var(--butter);color:#090909;font-weight:600;transition:background .15s}

.ghost:hover,.pill:hover{background:var(--s2);border-color:var(--muted)}

.link{min-height:32px;padding:0;border:0;background:none;font-weight:500;color:var(--butter);text-decoration:underline;text-underline-offset:4px;text-align:left}

.bub,.opp-d{cursor:grab}.bub.drag,.opp-d.drag{cursor:grabbing}

.wcell,.mcell{cursor:default}.wcell{cursor:pointer}.wcell:hover{fill:rgba(246,231,193,.07)}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}

.scroll{overflow-x:auto}

.drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,100%);background:var(--s1);border-left:1px solid var(--line2);padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;z-index:25;box-shadow:-20px 0 60px rgba(0,0,0,.6);animation:slide .18s ease-out}

.cmd{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:none;text-align:left}
.cmd:hover,.cmd.sel{background:var(--s2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--butter);color:#090909;font-weight:600;padding:11px 20px;border-radius:8px;max-width:calc(100% - 32px);z-index:40}
.pulse{width:64px;height:64px;border-radius:50%;border:2px solid var(--butter);display:flex;align-items:center;justify-content:center;animation:pulse 1.6s ease-out infinite;flex:none}

.skel{height:18px;border-radius:6px;background:var(--s2)}

@media (max-width:760px){.bar1,.bar2{padding:8px 14px}main{padding:20px 14px 96px}.hide-s{display:none}}

body{display:flex;min-height:100vh}
#shell{flex:0 0 272px;height:100vh;position:sticky;top:0;overflow-y:auto;background:#090909;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
#wrap{flex:1;min-width:0}
#ctx{position:sticky;top:0;z-index:6;background:rgba(5,5,5,.96);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:10px 28px;min-height:56px}
.nv{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nv:hover{color:var(--ink);background:var(--s1)}.nv.on{color:var(--butter)}
.nv.sub{min-height:34px;padding-left:40px;font-size:13.5px;font-weight:400}.nv.sub.on{background:var(--s1);color:var(--ink)}
.only-narrow{display:none}
.fade{animation:fade .2s ease-out}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:1100px){body{flex-direction:column}#shell{position:static;height:auto;flex:none;border-right:0;border-bottom:1px solid var(--line);gap:10px}.only-narrow{display:inline-flex}#ctx{position:static;padding:10px 14px}}
.nv.pn{min-height:36px;justify-content:space-between;font-size:13.5px;font-weight:400;padding:0 10px}.nv.pn.on{background:var(--s2);color:var(--ink)}
.pg{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
#shell .field{min-height:38px;font-size:13.5px}#shell .ctrl .go,#shell .ctrl .ghost{min-height:40px;width:100%}
#shell .ctrl{display:flex;flex-direction:column;gap:14px}
.nv.sub{justify-content:space-between}
@media (max-width:1320px){.split{grid-template-columns:1fr}}
@media (max-width:1100px){body{flex-direction:column}#shell{position:static;height:auto;flex:none;border-right:0;border-bottom:1px solid var(--line)}#ctx{position:static}#shell .subs,#shell .ctrl{display:none}#shell.open{flex-direction:column;align-items:stretch}#shell.open .subs,#shell.open .ctrl{display:flex}#shell.open .cap{display:block}#shell{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px}#shell>.col{flex-direction:row;align-items:center;gap:10px;margin-top:0}#shell nav{flex-direction:row;flex-wrap:wrap;gap:4px}#shell .nv{width:auto;min-height:38px}#shell .cap{display:none}#shell label{flex-direction:row;align-items:center}#shell>.col>.row{border-top:0;padding:0}}
</style>
</head>
<body>
<aside id="shell" aria-label="Navigation and controls"></aside>
<div id="wrap"><div id="ctx"></div><main id="app"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></main></div>
<div id="drawer"></div><div id="modal"></div><div id="palette"></div>
<div id="toast" role="status" hidden></div>
<script>
/* =====================================================================
   NOETIS — competitive, brand and growth intelligence (single-file build)
   1. CONFIG   2. Stores   3. Discovery engines   4. App   5. Globe
   ===================================================================== */

/* ---------- 1. CONFIG ------------------------------------------------ */
const CONFIG = {
  SUPABASE_URL: "",          // e.g. "https://abcd1234.supabase.co"
  SUPABASE_ANON_KEY: "",     // publishable key only — never the service key
  RESEARCH_ENDPOINT: "",     // server function that streams discovery events (newline-delimited JSON)
  META_OAUTH_START_URL: "",  // server route that begins Meta OAuth; tokens never reach this page
  WORLD_SCRIPT: "https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.min.js" // country outlines for the globe
};
const TABLES = ["brands", "brand_profile_items", "products_services", "audience_profiles", "competitors", "market_signals", "opportunities", "opportunity_evidence", "experiments", "opportunity_notes", "strategies", "research_requests", "activity_events"];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
const now = () => new Date().toISOString();
const daysAgo = n => new Date(Date.now() - n * 864e5).toISOString();

/* ---------- 2. Stores ------------------------------------------------
   Same four async methods on both, so the app never knows which it has:
   list(table, where)  insert(table, row)  update(table, id, patch)  remove(table, id)   */
class LocalStore {
  constructor() {
    this.name = "local"; this.key = "noetis-workspace-v2"; this.persistent = true;
    try { this.db = JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { this.db = {}; this.persistent = false; }
    TABLES.forEach(t => { if (!Array.isArray(this.db[t])) this.db[t] = []; });
  }
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.db)); } catch (e) { this.persistent = false; } }
  async init() { return { ready: true }; }
  async list(table, where = {}) { return this.db[table].filter(r => Object.keys(where).every(k => r[k] === where[k])).map(r => ({ ...r })); }
  async insert(table, row) { const r = { id: uid(), created_at: now(), ...row }; this.db[table].push(r); this.save(); return { ...r }; }
  async update(table, id, patch) { const r = this.db[table].find(x => x.id === id); if (!r) throw new Error("Row not found"); Object.assign(r, patch, { updated_at: now() }); this.save(); return { ...r }; }
  async remove(table, id) {
    this.db[table] = this.db[table].filter(x => x.id !== id);
    if (table === "brands") TABLES.filter(t => t !== "brands").forEach(t => { this.db[t] = this.db[t].filter(x => x.brand_id !== id); });
    if (table === "opportunities") { this.db.opportunity_evidence = this.db.opportunity_evidence.filter(x => x.opportunity_id !== id); this.db.strategies = this.db.strategies.filter(x => x.opportunity_id !== id); }
    if (table === "market_signals") this.db.opportunity_evidence = this.db.opportunity_evidence.filter(x => x.signal_id !== id);
    this.save();
  }
  dump() { return JSON.parse(JSON.stringify(this.db)); }
  wipe() { TABLES.forEach(t => { this.db[t] = []; }); this.save(); }
}

class SupabaseStore {
  constructor(url, key) { this.name = "supabase"; this.url = url; this.key = key; this.persistent = true; this.workspaceId = null; this.user = null; }
  async init() {
    if (!window.supabase) await new Promise((ok, fail) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"; s.onload = ok; s.onerror = () => fail(new Error("Could not load supabase-js")); document.head.appendChild(s); });
    this.client = window.supabase.createClient(this.url, this.key);
    const { data } = await this.client.auth.getSession();
    this.user = data.session ? data.session.user : null;
    if (!this.user) return { ready: false };
    await this.ensureWorkspace(); return { ready: true };
  }
  async signIn(email, password) { const { data, error } = await this.client.auth.signInWithPassword({ email, password }); if (error) throw error; this.user = data.user; await this.ensureWorkspace(); }
  async signUp(email, password) { const { data, error } = await this.client.auth.signUp({ email, password }); if (error) throw error; if (!data.session) throw new Error("Check your email to confirm the account, then sign in."); this.user = data.user; await this.ensureWorkspace(); }
  async signOut() { await this.client.auth.signOut(); this.user = null; this.workspaceId = null; }
  async ensureWorkspace() {
    const { data, error } = await this.client.from("workspace_members").select("workspace_id").limit(1); if (error) throw error;
    if (data.length) { this.workspaceId = data[0].workspace_id; return; }
    const made = await this.client.rpc("create_workspace", { workspace_name: "NOETIS" }); if (made.error) throw made.error; this.workspaceId = made.data;
  }
  async list(table, where = {}) { let q = this.client.from(table).select("*").order("created_at"); Object.entries(where).forEach(([k, v]) => { q = q.eq(k, v); }); const { data, error } = await q; if (error) throw error; return data; }
  async insert(table, row) { const { data, error } = await this.client.from(table).insert({ ...row, workspace_id: this.workspaceId }).select().single(); if (error) throw error; return data; }
  async update(table, id, patch) { const { data, error } = await this.client.from(table).update({ ...patch, updated_at: now() }).eq("id", id).select().single(); if (error) throw error; return data; }
  async remove(table, id) { const { error } = await this.client.from(table).delete().eq("id", id); if (error) throw error; }   // children go via ON DELETE CASCADE
}


/* ---------- 3. Discovery engines -------------------------------------
   An engine is an async generator yielding events:
     { stage: 0-4, kind: "ok" | "skip" | "warn", msg, write?: { table, row, links?: [signal keys] } }
   The runner saves each write as it arrives and never overwrites a user-confirmed record. */
const STAGES = ["Reading the website", "Building the brand profile", "Mapping competitors", "Listening for signals", "Framing opportunities"];
const wait = ms => new Promise(r => setTimeout(r, ms));
const list = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);

// No engine connected: file what the client told us, and say plainly what was skipped.
async function* ManualEngine(brand) {
  const o = brand.onboarding || {}, mine = { provenance: "user_confirmed", confidence: "High", status: "confirmed", source_url: "" };
  const file = async function* (section, label, text, stage) { if (String(text || "").trim()) { yield { stage: stage, kind: "ok", msg: `filed from onboarding: ${label}`, write: { table: "brand_profile_items", row: { section, label, text, ...mine } } }; await wait(170); } };
  yield { stage: 0, kind: "ok", msg: "Brand record and onboarding answers saved" }; await wait(380);
  yield { stage: 0, kind: "skip", msg: `${brand.website} not read — discovery engine not connected` }; await wait(380);
  for (const [sec, label, text] of [
    ["business", "What the business is", o.description], ["business", "Business model", o.business_model ? o.business_model + (o.business ? " — " + o.business : "") : o.business], ["business", "Revenue model", o.business], ["business", "Problem it solves", o.problem], ["business", "Business objectives", [o.goal, o.success].filter(Boolean).join(" — ")], ["business", "Growth priority", o.growth_priority], ["business", "Business stage", o.stage],
    ["dna", "Brand promise", o.promise], ["dna", "Personality", o.personality], ["dna", "Tone of voice", o.tone],
    ["needs", "Customer needs", o.needs], ["needs", "Motivations", o.motivations], ["needs", "Pain points", o.barriers], ["needs", "Purchase triggers", o.triggers], ["needs", "Buying behaviour", o.buying_behaviour],
    ["positioning", "Positioning statement", o.positioning_statement], ["positioning", "Value proposition", o.value_prop], ["positioning", "Differentiators", o.positioning], ["positioning", "Price position", o.price_pos], ["positioning", "Perceived strengths", o.strengths], ["positioning", "Perceived weaknesses", o.weaknesses],
    ["business", "Marketing running now", o.activities], ["business", "Marketing priorities", o.priorities], ["business", "Campaign objectives", o.campaign_objectives], ["business", "Content approach", o.content_strategy], ["business", "Distribution", o.distribution], ["business", "Performance data available", o.perf_data], ["business", "Channels in use", (o.channels || []).join(", ")], ["business", "Paid platforms", (o.paid_platforms || []).join(", ")], ["business", "Social presence", o.social]
  ]) yield* file(sec, label, text, 1);
  for (const name of list(o.products)) { yield { stage: 1, kind: "ok", msg: `product filed: ${name}`, write: { table: "products_services", row: { name, description: "", problem: o.problem || "", provenance: "user_confirmed", source_url: "" } } }; await wait(150); }
  for (const name of list(o.services)) { yield { stage: 1, kind: "ok", msg: `service filed: ${name}`, write: { table: "products_services", row: { name, category: "Service", description: "", provenance: "user_confirmed", source_url: "" } } }; await wait(150); }
  if (o.intended) { yield { stage: 1, kind: "ok", msg: "intended audience filed", write: { table: "audience_profiles", row: { kind: "intended", name: list(o.segments)[0] || "", description: o.intended, demographics: o.demographics || "", geography: o.geo_distribution || "", motivations: o.motivations || "", pains: o.barriers || "", triggers: o.triggers || "", behaviour: o.buying_behaviour || "", basis: "", provenance: "user_confirmed" } } }; await wait(240); }
  for (const name of list(o.segments).slice(1)) { yield { stage: 1, kind: "ok", msg: `segment filed: ${name}`, write: { table: "audience_profiles", row: { kind: "intended", name, description: "Named during onboarding. Nothing else is known about this segment yet.", provenance: "user_confirmed" } } }; await wait(120); }
  if (o.observed) { yield { stage: 1, kind: "ok", msg: `observed audience filed (${o.basis || "basis not given"})`, write: { table: "audience_profiles", row: { kind: "observed", description: o.observed, basis: o.basis || "", provenance: "user_confirmed" } } }; await wait(240); }

// Real engine: POSTs the brand to your endpoint and reads newline-delimited JSON events back.
async function* RemoteEngine(brand) {
  const res = await fetch(CONFIG.RESEARCH_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ brand }) });
  if (!res.ok || !res.body) throw new Error(`Discovery endpoint answered ${res.status}`);
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) { const { value, done } = await reader.read(); if (done) break; buf += dec.decode(value, { stream: true }); const lines = buf.split("\n"); buf = lines.pop(); for (const line of lines) if (line.trim()) yield JSON.parse(line); }
  if (buf.trim()) yield JSON.parse(buf);
}
/* The app cannot know whether a discovery engine is deployed beside it, so it asks once.
   api/research answers GET with whether it is configured. Nothing is assumed either way. */
async function detectEngine() {
  if (CONFIG.RESEARCH_ENDPOINT || !/^https?:$/.test(location.protocol)) return;
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 3000);
  try {
    const res = await fetch("/api/research", { signal: ac.signal });
    if (!res.ok) return;
    const j = await res.json();
    if (!j || j.engine !== "noetis-research") return;
    ENGINE.found = true; ENGINE.ready = !!j.ready; ENGINE.model = j.model || ""; ENGINE.webSearch = !!j.webSearch; ENGINE.reason = j.reason || "";
    if (j.ready) CONFIG.RESEARCH_ENDPOINT = "/api/research";
  } catch (e) { /* no engine deployed, or it did not answer: the app says so rather than guessing */ }
  finally { clearTimeout(t); }
}
const ENGINE = { found: false, ready: false, model: "", webSearch: false, reason: "" };
const engineNote = () => CONFIG.RESEARCH_ENDPOINT ? `Connected${ENGINE.model ? " · " + ENGINE.model : ""}${ENGINE.found && !ENGINE.webSearch ? " · site only, external research off" : ""}`
  : ENGINE.found ? ENGINE.reason || "Deployed but not configured." : "Not connected.";

function engineFor(brand) {
  if (CONFIG.RESEARCH_ENDPOINT) return { name: "remote", run: () => RemoteEngine(brand) };
  return { name: "manual", run: () => ManualEngine(brand) };
}

/* ----- discovery runner ----- */
async function startRun(b) {
  const engine = engineFor(b);
  S.run = { brandId: b.id, engine: engine.name, status: "running", log: [], stage: 0, saved: 0, kept: 0 };
  await store.update("brands", b.id, { status: "researching" }); b.status = "researching"; go("run");
  const keys = {};
  try {
    for await (const ev of engine.run()) {
      S.run.stage = ev.stage;
      if (ev.write) {
        const { table, row, links } = ev.write, { key, ...clean } = row;
        if (table === "brands") { await store.update("brands", b.id, clean); Object.assign(b, clean); S.run.saved++; S.run.log.push({ stage: ev.stage, kind: ev.kind, msg: ev.msg }); if (S.route === "run") render(); continue; }
        /* Anything a person has already ruled on is never overwritten or proposed again, and a
           candidate that is still waiting is refreshed in place rather than duplicated. */
        const settled = x => x.provenance === "user_confirmed" || x.status === "confirmed" || x.status === "rejected";
        const have = await store.list(table, { brand_id: b.id });
        const same = { brand_profile_items: x => x.section === row.section && x.label === row.label,
          products_services: x => x.name.toLowerCase() === String(row.name || "").toLowerCase(),
          audience_profiles: x => x.kind === row.kind && (x.name || "") === (row.name || ""),
          competitors: x => x.name.toLowerCase() === String(row.name || "").toLowerCase(),
          market_signals: x => x.text === row.text || (row.source_url && x.source_url === row.source_url) }[table];
        const prior = same ? have.find(same) : null;
        const mineAlready = !!prior && settled(prior);
        if (prior && !mineAlready) { await store.update(table, prior.id, clean); if (key) keys[key] = prior.id; S.run.saved++;
          S.run.log.push({ stage: ev.stage, kind: ev.kind, msg: ev.msg }); if (S.route === "run") render(); continue; }
        if (mineAlready) { S.run.kept++; S.run.log.push({ stage: ev.stage, kind: "skip", msg: `already on file, left alone: ${row.label || row.name || row.kind || "record"}` }); if (S.route === "run") render(); continue; }
        const saved = await store.insert(table, { ...clean, brand_id: b.id, captured_at: now() }); S.run.saved++;
        if (key) keys[key] = saved.id;
        for (const k of links || []) if (keys[k]) await store.insert("opportunity_evidence", { brand_id: b.id, opportunity_id: saved.id, signal_id: keys[k] });
      }
      S.run.log.push({ stage: ev.stage, kind: ev.kind, msg: ev.msg });
      if (S.route === "run") render();
    }
    S.run.status = S.run.log.some(l => l.kind === "skip") ? "partial" : "done";
  } catch (e) { S.run.status = "failed"; S.run.log.push({ stage: S.run.stage, kind: "warn", msg: "Run failed: " + (e.message || e) }); }
  await mutate(() => store.update("brands", b.id, { status: "ready", last_run_at: now(), last_run_status: S.run.status }),
    `Discovery run ${S.run.status} (${engine.name} engine): ${S.run.saved} records saved`, S.run.status === "failed" ? "The run failed. You can retry." : "Discovery finished.");
  if (S.reviewAfterRun && S.run.status !== "failed" && S.route === "run") go("review");
}

      + pg("How much is filled in", `<div class="row" style="gap:10px;flex-wrap:nowrap"><span class="bar" style="flex:1"><i style="width:${f.pct}%;background:var(--butter)"></i></span><strong class="small">${f.pct}%</strong></div>${f.checks.filter(c => !c[1]).map(c => `<div class="small muted">Missing: ${c[0].toLowerCase()}</div>`).join("")}<p class="small muted">Filled in is not the same as correct.</p>`); },
  signals(b, f) { const c = S.canvasF, v = S.sigView, feed = ["opps", "matrix"].includes(v);
    const geos = [...new Set(f.opps.map(o => o.geography).filter(Boolean))], auds = [...new Set(f.opps.map(o => o.affects).filter(Boolean))], prods = [...new Set(f.opps.map(o => o.product).filter(Boolean))];

      + psel("Type", "oppType", S.oppType, ["All", ...(S.oppCatF === "All" ? OPP_TYPES : OPP_CATS[S.oppCatF][1])]));
    const where = pg("Where it applies", psel("Geography", "oppGeo", S.oppGeo, ["All", ...geos]) + psel("Audience", "oppAud", S.oppAud, ["All", ...auds]) + psel("Product or service", "oppProd", S.oppProd, ["All", ...prods]));
    const assess = pg("Assessment filters", psel("Potential impact", "canvasF.impact", c.impact, ["Any", ...L3]) + psel("Feasibility (by effort)", "oppFeas", S.oppFeas, ["Any", ...L3]) + psel("Urgency", "canvasF.urgency", c.urgency, ["Any", ...L3]) + psel("Evidence confidence", "canvasF.strength", c.strength, ["Any", "Strong", "Moderate", "Thin", "None"]) + psel("Horizon", "canvasF.horizon", c.horizon, ["Any", ...HORIZON]));
    const status = pg("Status", psel("Show", "oppFilter", S.oppFilter, Object.keys(FILT)) + `<p class="small muted">Open means new, investigating or prioritised.</p>`);
    const weights = pg("Priority weighting", DIMS5.map(d => `<label style="flex-direction:row;align-items:center;gap:10px"><span class="small" style="flex:1">${d[1]}</span><input class="field" style="width:62px;min-height:34px" type="number" min="0" max="5" step="1" data-w5="${d[0]}" value="${S.weights[d[0]]}"></label>`).join("")
      + `<div class="small muted mono">${priorityText()}</div><p class="small muted">A plain weighted mean of the five assessments, each on a 1–5 scale. Set a weight to 0 to leave a dimension out.</p>`);
    const research = pg("Research and actions", '<button class="go" data-act="add" data-table="opportunities">Frame an opportunity</button><button class="ghost" data-act="add" data-table="market_signals" data-kind="signal">Add a signal</button><button class="ghost" data-act="exportOpps">Export the report</button><p class="small muted">Opportunities are framed from evidence by a person. Nothing is generated automatically, and no opportunity moves into execution without a decision.</p>');
    if (v === "opps") return search + status + cats + where + assess + pg("Order", psel("Sort by", "oppSort", S.oppSort, SORTS) + '<p class="small muted">One stated dimension at a time. "Team priority" is your own order; nothing changes it but you.</p>') + research;

    if (v === "emerging") return pg("Signal filters", psel("Kind", "sigKind", S.sigKind, ["All", ...Object.entries(KINDS)]) + psel("Subject", "globe.cat", S.globe.cat, ["All", ...Object.entries(CATS)]) + psel("Time period", "globe.time", S.globe.time, PERIODS)) + research;
    if (v === "all") return pg("Evidence filters", psel("Kind", "sigKind", S.sigKind, ["All", ...Object.entries(KINDS)]) + psel("Subject", "globe.cat", S.globe.cat, ["All", ...Object.entries(CATS)]) + psel("Time period", "globe.time", S.globe.time, PERIODS)) + research;
    if (v === "experiments") return pg("Experiments", `<p class="small">${of("experiments").length} on file across ${new Set(of("experiments").map(x => x.opportunity_id)).size} opportunit${new Set(of("experiments").map(x => x.opportunity_id)).size === 1 ? "y" : "ies"}.</p><p class="small muted">An experiment is created from an opportunity, so it keeps its context. Results are only ever entered by a person.</p>`) + research;

  strategies(b, f) { const r = S.route, s = S.strategyId && find("strategies", S.strategyId), sb = S.sb, acc = f.accepted;

        + `<label><span class="cap">Market</span><input class="field" data-sb="market" value="${esc(sb.market || b.geography)}"></label><label><span class="cap">Budget (optional)</span><input class="field" data-sb="budget" value="${esc(sb.budget)}" placeholder="e.g. ₹1,00,000"></label><label><span class="cap">Timeline (optional)</span><input class="field" data-sb="timeframe" value="${esc(sb.timeframe)}" placeholder="e.g. four weeks"></label><label><span class="cap">Measurement preference (optional)</span><input class="field" data-sb="measure" value="${esc(sb.measure)}" placeholder="e.g. cost per first order"></label><button class="go" data-act="createStrategy">Create the strategy</button>`) : pg("Strategy inputs", '<p class="small muted">Accept an opportunity first. A strategy starts from one.</p><button class="ghost" data-act="sigView" data-to="opps">Go to opportunities</button>');

    else if (s) body = pg("This strategy", psel("Status", "strategyStatus", s.status, [["draft", "Draft"], ["in_review", "In review"], ["approved", "Approved"]]) + `<div class="small">Owner: ${esc(s.owner) || '<span class="muted">unassigned</span>'}</div><button class="ghost" data-act="editBlock" data-k="owner">Assign owner</button><button class="ghost" data-act="copyStrategy">Copy as text</button><button class="link small" data-act="closeStrategy">← All strategies</button>`);
    else body = pg("Actions", `<button class="go" data-act="nav" data-to="builder" ${acc.length ? "" : "disabled"}>Build a strategy</button><p class="small muted">${acc.length} accepted opportunit${acc.length === 1 ? "y" : "ies"} available to build from.</p>`);
    return body; }
};

/* ----- module 02 helpers ----- */
const compOf = s => s.competitor_id ? find("competitors", s.competitor_id) : null;
/* Named in the text, or sharing a host with the source link. Name matching is literal. */
const compsFor = s => { const c = compOf(s); if (c) return [c]; return of("competitors").filter(x => s.text.includes(x.name) || (s.source_url && x.source_url && s.source_url.split("/")[0] === x.source_url.split("/")[0])); };
const compSignals = (f, c) => f.signals.filter(s => s.competitor_id === c.id || s.text.includes(c.name) || (s.source_url && c.source_url && s.source_url.split("/")[0] === c.source_url.split("/")[0]));
const ffMatch = s => (S.ff.comp === "All" || compsFor(s).some(c => c.id === S.ff.comp)) && (S.ff.event === "All" || (s.event || "Other") === S.ff.event) && (S.ff.rel === "All" || s.relevance === S.ff.rel);
const cqMatch = c => { const q = S.cq.trim().toLowerCase(); return !q || (c.name + " " + (c.positioning || "") + " " + (c.offering || "") + " " + (c.markets || "")).toLowerCase().includes(q); };
const kindTag = k => `<span class="tag ${k === "Direct" ? "warn" : ""}">${esc(k)}</span>`;
const compLink = c => `<button class="link" data-act="openComp" data-id="${c.id}">${esc(c.name)}</button>`;

V.ci = function () {
  const b = brand(); if (!b) return noBrand(); const f0 = facts(b.id), f = scoped(f0);
  if (!f0.comps.length) return `${head("Competitive intelligence", "Where does the brand stand?")}${emptyState("No competitors on file yet", "Competitive intelligence starts with the companies this brand is up against. Start with discovery: it uses the brand profile you already filled in, and nothing is added to the confirmed set without you.", "nav", "discovery", "Open competitor discovery")}`;
  const t = territories(b, f, S.wx, S.wy), located = f0.signals.filter(s => country(s.country));
  const byKind = k => f0.comps.filter(c => c.kind === k && c.status === "confirmed");
  const cand = f0.comps.filter(c => c.status === "candidate"), excluded = f0.comps.filter(c => c.status === "excluded");
  const dev = f0.signals.filter(s => s.category === "competitor" && !s.dismissed).sort((x, y) => sigDate(y).localeCompare(sigDate(x))).slice(0, 5);
  const cat = f0.signals.filter(s => ["category", "regulatory", "product"].includes(s.category) && !s.dismissed).sort((x, y) => sigDate(y).localeCompare(sigDate(x))).slice(0, 4);
  const threats = f0.signals.filter(s => s.kind === "threat" || (s.relevance === "High" && s.category === "competitor")).sort((x, y) => sigDate(y).localeCompare(sigDate(x)));
  const diff = f0.signals.filter(s => ["whitespace", "underused", "gap"].includes(s.kind));
  const stat = (n, l, to, note) => `<button class="card" data-act="nav" data-to="${to}" style="gap:4px;align-items:flex-start"><span style="font-size:34px;font-weight:600;line-height:1">${n}</span><span class="cap">${l}</span>${note ? `<span class="small muted">${note}</span>` : ""}</button>`;
  const colm = (cap, title, body, to, label) => `<div class="col" style="gap:8px;border-top:1px solid var(--line2);padding-top:14px"><div class="cap">${cap}</div><h2>${title}</h2>${body}<button class="link small" data-act="nav" data-to="${to}">${label}</button></div>`;
  return `${head("Competitive intelligence", "Where does the brand stand?", `<div class="row">${demoTag(b)}<button class="ghost" data-act="exportCI">Export the report</button></div>`)}
    <p class="muted" style="max-width:820px;margin-top:-10px">Read against ${esc(b.name)}'s own profile: ${esc(b.category)}, primary market ${esc(b.geography)}${b.markets ? ", also " + esc(b.markets) : ""}. Nothing here is re-entered; it comes from Brand &amp; Market Intelligence.</p>
    ${cand.length ? `<div class="banner"><div><strong>${cand.length} candidate${cand.length > 1 ? "s" : ""} waiting for your call.</strong> <span class="muted">Looking similar does not make a company a competitor. Nothing enters the confirmed set until you say so.</span></div><button class="go" data-act="nav" data-to="discovery">Review them</button></div>` : ""}
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${stat(byKind("Direct").length, "Direct", "profiles", "Same buyer, same job")}
      ${stat(byKind("Indirect").length, "Indirect", "profiles", "Different answer, same want")}
      ${stat(byKind("Emerging").length, "Emerging", "profiles", "Small now, moving")}
      ${stat(byKind("Adjacent").length, "Adjacent", "profiles", "Next category over")}
      ${stat(f0.comps.filter(c => c.status === "confirmed").length, "Confirmed in total", "profiles", `${cand.length} candidate${cand.length === 1 ? "" : "s"}${excluded.length ? ", " + excluded.length + " excluded" : ""}`)}</div>
    <p class="small muted" style="margin-top:-8px">Counts are of records on file, not of the market. No market share, ranking or company size is shown anywhere in this module, because no source on file supports one.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px">
      ${colm("Recent competitive developments", `${dev.length} on file`, dev.map(s => `<button class="link small" style="color:var(--ink);text-decoration:none;text-align:left" data-act="openSignal" data-id="${s.id}">${day(sigDate(s))} — ${esc(s.text)}${s.event ? `<span class="muted"> · ${esc(s.event)}</span>` : ""}</button>`).join("") || '<p class="small muted">Nothing recorded. Add what you observe, with where you saw it.</p>', "moves", "Open the signal feed")}
      ${colm("Category movements", `${cat.length} on file`, cat.map(s => `<button class="link small" style="color:var(--ink);text-decoration:none;text-align:left" data-act="openSignal" data-id="${s.id}">${day(sigDate(s))} — ${esc(s.text)}</button>`).join("") || '<p class="small muted">Nothing recorded.</p>', "moves", "Filter the feed by category")}
      ${colm("Key competitive threats", `${threats.length} flagged`, threats.slice(0, 4).map(s => `<div class="small" style="border-left:2px solid var(--warn);padding-left:10px;margin-bottom:8px"><button class="link" style="color:var(--ink);text-decoration:none;text-align:left" data-act="openSignal" data-id="${s.id}">${esc(s.text)}</button>${s.brand_meaning ? `<div class="muted" style="margin-top:3px">${esc(s.brand_meaning)}</div>` : ""}</div>`).join("") || '<p class="small muted">None flagged. A threat is a signal you marked as one, not a score.</p>', "moves", "All signals")}
      ${colm("Potential differentiation", `${diff.length} recorded`, diff.slice(0, 4).map(s => `<button class="link small" style="color:var(--ink);text-decoration:none;text-align:left" data-act="openSignal" data-id="${s.id}">${esc(s.text)}</button>`).join("") || '<p class="small muted">None yet. White-space analysis is where these are recorded.</p>', "whitespace", "Open white-space analysis")}</div>
    <div class="viz"><div class="row between" style="padding:14px 18px;border-bottom:1px solid var(--line)"><div><h2>Competitive positioning: ${DIMS[S.wx][0].toLowerCase()} against ${DIMS[S.wy][0].toLowerCase()}</h2><p class="small muted">${f.live.length} of ${f0.live.length} companies shown. Change the dimensions and filters on the left.</p></div><span class="small muted">Positions are 1–5 judgements${b.is_demo ? " · demo data" : ""}</span></div>${whitespaceMap(b, f)}<div class="row small muted" style="padding:10px 18px;border-top:1px solid var(--line);gap:6px 18px"><span>Select a company for its profile · drag to reposition</span><span>Dashed circle = inferred placement</span><span style="color:var(--olive)">Dashed green = nobody placed</span><span style="color:var(--warn)">Shaded = crowded</span></div></div>
    <p style="max-width:820px"><strong>What this shows.</strong> ${t.crowded ? `${t.crowded} territor${t.crowded === 1 ? "y is" : "ies are"} crowded and ` : ""}${t.open} ${t.open === 1 ? "is" : "are"} unoccupied on these dimensions, from ${t.placed} placed companies${t.inferred ? `, ${t.inferred} of them inferred rather than placed by you` : ""}. Unoccupied means nobody on file is placed there; it does not mean customers want it. ${located.length} signal${located.length === 1 ? " is" : "s are"} located on the globe.</p>`;
};

V.discovery = function () {
  const b = brand(); if (!b) return noBrand(); const f = facts(b.id), items = f.items;
  const val = (sec, label) => { const r = items.find(i => i.section === sec && i.label === label && i.status !== "rejected"); return r ? r.text : ""; };
  const cand = f.comps.filter(c => c.status === "candidate" && cqMatch(c)), live = f.comps.filter(c => c.status === "confirmed" && cqMatch(c)), out = f.comps.filter(c => c.status === "excluded" && cqMatch(c));
  const frame = [["Category", b.category], ["Primary market", b.geography + (b.markets ? " · also " + b.markets : "")], ["Products and services", f.products.map(p => p.name).join(", ")], ["Intended audience", (f.aud.find(x => x.kind === "intended") || {}).description || ""], ["Positioning", val("positioning", "Positioning statement") || val("positioning", "Differentiators")], ["Price position", val("positioning", "Price position")], ["Business objective", b.goal]];
  const row = c => `<div class="item"><div style="flex:1 1 200px;max-width:260px"><button class="link" style="color:var(--ink);text-decoration:none;font-size:16px;font-weight:600" data-act="openComp" data-id="${c.id}">${esc(c.name)}</button><div class="small muted mono">${esc(c.website) || "no website on file"}</div></div>
    <div class="col" style="flex:999 1 280px;min-width:0;gap:6px"><div class="small">${esc(c.note) || '<span class="muted">No reason recorded</span>'}</div>${c.why ? `<div class="small muted">Why it came up: ${esc(c.why)}</div>` : ""}<div class="row" style="gap:8px">${kindTag(c.kind)}${statusTag(c.status)}${src(c)}<span class="small muted">${esc(c.markets) || "markets unknown"}</span></div></div>
    <div class="row" style="gap:6px">${c.status !== "confirmed" ? `<button class="pill" data-act="status" data-table="competitors" data-id="${c.id}" data-v="confirmed">Confirm</button>` : ""}<select class="field" style="min-height:34px;width:120px" data-kind="${c.id}">${COMP_KINDS.map(k => `<option ${k === c.kind ? "selected" : ""}>${k}</option>`).join("")}</select><button class="pill" data-act="edit" data-table="competitors" data-id="${c.id}">Edit</button>${c.status !== "excluded" ? `<button class="pill" data-act="status" data-table="competitors" data-id="${c.id}" data-v="excluded">Not a competitor</button>` : `<button class="pill" data-act="status" data-table="competitors" data-id="${c.id}" data-v="candidate">Restore</button>`}</div></div>`;
  return `${head("Competitive intelligence", "Who are we actually up against?", `<div class="row">${demoTag(b)}<button class="go" data-act="addComp">Add a competitor</button></div>`)}
    <div class="sunk col" style="gap:10px"><div class="cap">What discovery searches against</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 24px">${frame.map(([l, v]) => `<div><div class="cap">${l}</div><div class="small ${v ? "" : "muted"}">${esc(v) || "Not on file"}</div></div>`).join("")}</div>
      <p class="small muted">Taken from the brand profile. Nothing is asked for twice — fix it in <button class="link small" data-act="chapter" data-to="overview">Brand &amp; Market Intelligence</button> and discovery changes with it.</p>
      <div class="row" style="gap:8px"><button class="go" data-act="rerun">Run competitor discovery</button><button class="ghost" data-act="addComp">Add by hand</button></div>
      <p class="small ${CONFIG.RESEARCH_ENDPOINT ? "muted" : ""}" style="${CONFIG.RESEARCH_ENDPOINT ? "" : "color:var(--warn)"}">${CONFIG.RESEARCH_ENDPOINT ? "The discovery engine is connected. Anything it finds arrives as a candidate, never as a confirmed competitor." : "No discovery engine is connected, so no company can be found automatically and none is invented here. Candidates below came from the demo set or from names you entered."}</p></div>
    <div class="col"><div class="row between"><h2>Candidates</h2><span class="small muted">${cand.length} waiting</span></div><p class="muted small">Suggested, not accepted. Judge each one: a company that looks similar is not necessarily competing for the same buyer.</p>
      ${cand.length ? `<div>${cand.map(row).join("")}</div>` : `<div class="sunk"><p class="muted">${f.comps.some(c => c.status === "candidate") ? "None match the search." : "No candidates waiting."}</p></div>`}</div>
    <div class="col"><div class="row between"><h2>Confirmed competitive set</h2><span class="small muted">${live.length} companies</span></div>
      ${live.length ? `<div>${live.map(row).join("")}</div>` : `<div class="sunk"><p class="muted">Nothing confirmed yet.</p></div>`}</div>
    ${out.length ? `<div class="col"><h2>Ruled out</h2><p class="muted small">Kept, not deleted, so the same company is not suggested again as though it were new.</p><div>${out.map(row).join("")}</div></div>` : ""}`;

V.compare = function () {

/* Coverage analysis: does anything a competitor publishes mention the terms of this need?
   Literal term matching against the text on file. It finds silence, never proves absence. */
const STOP = new Set("about above after again against because before being below between both could doing during each enough every first from further going having into itself might money, more most other over same should still such than that their them then there these thing things think those three through under until very what when where which while with would your".split(" "));
const terms = t => [...new Set(String(t || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w.length > 4 && !STOP.has(w)))].slice(0, 8);
const compText = c => [c.positioning, c.value_prop, c.offering, c.messaging, c.differentiation, c.audience, c.note, c.activity, c.pricing].join(" ").toLowerCase();
function coverage(b, f) {
  const rows = [], add = (kind, label, text, ts) => { if (!ts.length) return; const hit = f.live.filter(c => ts.some(t => compText(c).includes(t)));
    rows.push({ kind, label, text, terms: ts, on: hit, off: f.live.filter(c => !hit.includes(c)) }); };
  f.items.filter(i => i.section === "needs" && i.status !== "rejected").forEach(i => add("Customer need", i.label, i.text, terms(i.text)));
  f.products.forEach(p => add("Product coverage", p.name, p.description || p.name, terms(p.name + " " + (p.category || ""))));
  f.aud.filter(x => x.description).forEach(x => add("Audience segment", x.name || (x.kind === "observed" ? "Observed audience" : "Intended audience"), x.description, terms(x.description)));
  f.items.filter(i => i.section === "positioning" && ["Differentiators", "Brand promise"].includes(i.label)).forEach(i => add("Messaging territory", i.label, i.text, terms(i.text)));
  return rows;
}

const oppCard = (o, n, total, f) => { const st = strength(o.id), ev = evidenceOf(o.id), ok = assessed(o);
  return `<div class="panel" style="border-left:3px solid ${stColor(o)};${["rejected", "completed"].includes(o.status) ? "opacity:.6" : ""}">
    <div class="row between"><span class="row" style="gap:6px">${stTag(o)}<span class="tag">${esc(OPP_CATS[oppCat(o)][0])}</span></span><span class="tag ${st === "None" || st === "Thin" ? "warn" : "ok"}" title="${STRENGTH_RULE}">Evidence ${st.toLowerCase()} · ${ev.length}</span></div>

/* Impact against feasibility, on the three-step scale the assessments actually use.
   Dragging snaps to a cell, so a drag changes a stated judgement and never invents precision. */
function matrixSvg(rows) {
  const W = 760, H = 500, x0 = 96, y0 = 28, x1 = W - 30, y1 = H - 64, cw = (x1 - x0) / 3, ch = (y1 - y0) / 3;
  const fx = o => x0 + (L3.indexOf(o.effort) + 0.5) * cw, fy = o => y1 - (L3.indexOf(o.impact) + 0.5) * ch;
  const seen = {}, pos = o => { const k = o.effort + o.impact, n = seen[k] = (seen[k] || 0) + 1, ring = Math.ceil(n / 6), ang = (n % 6) * 1.05;
    return n === 1 ? [fx(o), fy(o)] : [fx(o) + Math.cos(ang) * 30 * ring, fy(o) + Math.sin(ang) * 26 * ring]; };
  let cells = "";
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { const best = i === 0 && j === 2;
    cells += `<rect class="mcell" data-mcell="${i},${j}" x="${x0 + i * cw + 3}" y="${y1 - (j + 1) * ch + 3}" width="${cw - 6}" height="${ch - 6}" rx="8" fill="${best ? "rgba(246,231,193,.06)" : "transparent"}" stroke="${best ? "#5a564d" : "#232320"}"/>`; }
  const disc = o => { const [x, y] = pos(o), st = strength(o.id), r = { High: 25, Medium: 21, Low: 17 }[o.urgency] || 21;
    return `<g class="opp-d" tabindex="0" role="button" data-opp="${o.id}" aria-label="${esc(o.name)}: ${o.impact} impact, ${o.effort} effort, ${o.urgency} urgency, evidence ${st.toLowerCase()}" transform="translate(${x},${y})">
      <circle r="${r}" fill="#171717" stroke="${stColor(o)}" stroke-width="2" ${st === "None" || st === "Thin" ? 'stroke-dasharray="4 4"' : ""}/>
      <text y="4" text-anchor="middle" font-size="10" font-weight="700" fill="${stColor(o)}" pointer-events="none">${esc(o.name.split(" ").map(w => w[0]).join("").slice(0, 3).toUpperCase())}</text>
      <text y="${r + 15}" text-anchor="middle" font-size="11" fill="#FCF8EF" pointer-events="none">${esc(o.name.length > 26 ? o.name.slice(0, 24) + "…" : o.name)}</text></g>`; };
  return `<svg id="oppMatrix" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;touch-action:none" role="group" aria-label="Opportunities by impact and feasibility">${cells}
    ${["High", "Medium", "Low"].map((l, n) => `<text x="${x0 - 12}" y="${y0 + n * ch + ch / 2}" text-anchor="end" font-size="12" fill="#A69D8B">${l} impact</text>`).join("")}
    ${["High", "Medium", "Low"].map((l, n) => `<text x="${x0 + n * cw + cw / 2}" y="${y1 + 22}" text-anchor="middle" font-size="12" fill="#A69D8B">${l} feasibility</text>`).join("")}
    <text x="${x0 + (x1 - x0) / 2}" y="${H - 14}" text-anchor="middle" font-size="12" font-weight="600" fill="#F6E7C1" letter-spacing="1">FEASIBILITY →</text>
    ${rows.map(disc).join("")}</svg>`;
}

V.signals = function () {

  if (v === "opps") return `${head("Opportunity signals · opportunity feed", "Which opportunities are on the table?", `<div class="row">${demoTag(b)}<button class="ghost" data-act="exportOpps">Export</button></div>`)}
